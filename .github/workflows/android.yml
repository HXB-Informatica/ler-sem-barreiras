name: Android CI

on:
  push:
    branches: [main]
    tags:
      - "v*"
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install NDK and CMake
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "ndk;27.2.12479018" "cmake;3.22.1" "platforms;android-35" "build-tools;35.0.0"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Unit tests
        run: ./gradlew test --stacktrace

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Verify APK contents
        run: |
          set -euo pipefail
          APK=$(ls app/build/outputs/apk/debug/*.apk | head -n1)
          test -s "$APK"
          echo "APK verificado: $APK ($(wc -c < "$APK") bytes)"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ler-sem-barreiras-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          SOURCE_APK=$(ls app/build/outputs/apk/debug/*.apk | head -n1)
          test -s "$SOURCE_APK"
          RELEASE_APK="ler-sem-barreiras-${TAG}.apk"
          cp "$SOURCE_APK" "$RELEASE_APK"
          sha256sum "$RELEASE_APK" | tee "${RELEASE_APK}.sha256"

          TITLE_SUFFIX="${TAG#v}"
          TITLE_SUFFIX="${TITLE_SUFFIX//-beta/ Beta}"
          TITLE_SUFFIX="${TITLE_SUFFIX//-rc/ RC}"
          TITLE_SUFFIX="${TITLE_SUFFIX//-alpha/ Alpha}"
          TITLE="Ler sem Barreiras v${TITLE_SUFFIX}"

          PRERELEASE_ARGS=()
          TAG_LOWER="$(echo "$TAG" | tr '[:upper:]' '[:lower:]')"
          if echo "$TAG_LOWER" | grep -Eq '(^|[-.])(beta|rc|alpha|preview)([.-]|$)'; then
            PRERELEASE_ARGS+=(--prerelease)
          fi

          NOTES_FILE="docs/releases/${TAG}.md"
          if [ -f "$NOTES_FILE" ]; then
            NOTES_ARGS=(--notes-file "$NOTES_FILE")
          else
            NOTES_ARGS=(--notes "APK de teste assinado com a chave de depuração do Android. Destina-se a validação técnica, não a produção. Funciona offline após a instalação.")
          fi

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "A release $TAG já existe. Não serão substituídos artefactos."
            gh release view "$TAG" --repo "$GITHUB_REPOSITORY"
            exit 0
          fi

          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$TITLE" \
            "${PRERELEASE_ARGS[@]}" \
            "${NOTES_ARGS[@]}" \
            --verify-tag \
            "$RELEASE_APK" \
            "${RELEASE_APK}.sha256"
