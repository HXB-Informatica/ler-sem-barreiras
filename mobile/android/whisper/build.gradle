import java.net.URI
import java.util.zip.ZipInputStream

plugins {
    id "com.android.library"
    id "org.jetbrains.kotlin.android"
}

def whisperTag = "v1.9.5"
def whisperZipUrl = "https://github.com/ggml-org/whisper.cpp/archive/refs/tags/${whisperTag}.zip"
def modelFileName = project.hasProperty("whisperModel") ? project.property("whisperModel") : "ggml-base.bin"
def modelUrl = "https://huggingface.co/ggerganov/whisper.cpp/resolve/main/${modelFileName}"
def whisperSrcDir = file("src/main/cpp/third_party/whisper.cpp")
def modelDir = file("src/main/assets/models")
def modelFile = new File(modelDir, modelFileName)

tasks.register("fetchWhisperCpp") {
    outputs.dir(whisperSrcDir)
    outputs.upToDateWhen { new File(whisperSrcDir, "CMakeLists.txt").exists() }
    doLast {
        if (new File(whisperSrcDir, "CMakeLists.txt").exists()) {
            logger.lifecycle("whisper.cpp já está presente em ${whisperSrcDir.path}")
            return
        }
        whisperSrcDir.parentFile.mkdirs()
        def tmpZip = new File(layout.buildDirectory.get().asFile, "whisper.cpp-${whisperTag}.zip")
        tmpZip.parentFile.mkdirs()
        logger.lifecycle("A obter whisper.cpp ${whisperTag}…")
        URI.create(whisperZipUrl).toURL().withInputStream { input ->
            tmpZip.withOutputStream { output -> input.transferTo(output) }
        }
        def unzipRoot = new File(layout.buildDirectory.get().asFile, "whisper-unzip")
        unzipRoot.deleteDir()
        unzipRoot.mkdirs()
        tmpZip.withInputStream { stream ->
            def zip = new ZipInputStream(stream)
            def entry = zip.nextEntry
            while (entry != null) {
                def out = new File(unzipRoot, entry.name)
                if (entry.isDirectory()) {
                    out.mkdirs()
                } else {
                    out.parentFile.mkdirs()
                    out.withOutputStream { zip.transferTo(it) }
                }
                zip.closeEntry()
                entry = zip.nextEntry
            }
        }
        def extracted = unzipRoot.listFiles()?.find { it.isDirectory() }
        if (extracted == null) {
            throw new GradleException("Não foi possível extrair whisper.cpp.")
        }
        delete(whisperSrcDir)
        copy {
            from extracted
            into whisperSrcDir
        }
        logger.lifecycle("whisper.cpp extraído para ${whisperSrcDir.path}")
    }
}

tasks.register("fetchWhisperModel") {
    outputs.file(modelFile)
    outputs.upToDateWhen {
        modelFile.exists() && modelFile.length() > 1_000_000 && !hasSiblingWhisperModel(modelFile)
    }
    doLast {
        if (modelFile.exists() && modelFile.length() > 1_000_000) {
            logger.lifecycle("Modelo ${modelFile.name} já está presente.")
        } else {
            modelDir.mkdirs()
            logger.lifecycle("A obter modelo Whisper ${modelFile.name}…")
            URI.create(modelUrl).toURL().withInputStream { input ->
                modelFile.withOutputStream { output -> input.transferTo(output) }
            }
            logger.lifecycle("Modelo gravado em ${modelFile.path} (${modelFile.length()} bytes)")
        }
        modelFile.parentFile?.listFiles()?.findAll {
            it.isFile() && it.name.startsWith("ggml-") && it.name.endsWith(".bin") && it.name != modelFile.name
        }?.each {
            logger.lifecycle("A remover modelo antigo ${it.name}")
            it.delete()
        }
    }
}

def hasSiblingWhisperModel(File model) {
    model.parentFile?.listFiles()?.any {
        it.isFile() && it.name.startsWith("ggml-") && it.name.endsWith(".bin") && it.name != model.name
    }
}

android {
    namespace "pt.lersembarreiras.whisper"
    compileSdk rootProject.ext.compileSdkVersion
    ndkVersion rootProject.ext.ndkVersion
    defaultConfig {
        minSdk rootProject.ext.minSdkVersion
        ndk {
            abiFilters "arm64-v8a", "x86_64"
        }
        externalNativeBuild {
            cmake {
                cppFlags "-O3", "-fvisibility=hidden", "-std=c++17"
                arguments "-DANDROID_STL=c++_shared",
                        "-DGGML_NATIVE=OFF",
                        "-DGGML_OPENMP=OFF",
                        "-DWHISPER_BUILD_TESTS=OFF",
                        "-DWHISPER_BUILD_EXAMPLES=OFF",
                        "-DWHISPER_BUILD_SERVER=OFF",
                        "-DBUILD_SHARED_LIBS=OFF"
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = "17"
    }
    externalNativeBuild {
        cmake {
            path file("src/main/cpp/CMakeLists.txt")
            version "3.22.1"
        }
    }
    sourceSets {
        main {
            assets.srcDirs("src/main/assets")
        }
    }
}

afterEvaluate {
    tasks.matching { it.name.toLowerCase().contains("cmake") || it.name.toLowerCase().contains("externalnative") }
            .configureEach { dependsOn("fetchWhisperCpp") }
    tasks.matching { it.name.contains("Assets") || it.name == "preBuild" }
            .configureEach { dependsOn("fetchWhisperModel") }
}
